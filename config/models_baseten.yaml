# Baseten open-weight model registry for the integration-regression study.
#
# This is the open-weight arm of the study, reduced to a minimum viable check
# against the Gemini arm's findings rather than run at full scale.
#
# Prices are US dollars per 1,000,000 tokens, verified against
# https://www.baseten.co/pricing/ on 9 August 2026.
# Availability verified the same day by a live `GET /v1/models` against
# https://inference.baseten.co/v1 using an ephemeral key, minted and revoked.
#
# `cached_input` is recorded for the record only. It is NOT used in pricing:
# cached tokens are billed at the full input rate here, exactly as the Google
# arm does, so every cost figure stays an upper bound. That is the right error
# direction for a ceiling, and it keeps the two arms' cost accounting identical.
#
# Run `python src/verify_setup_baseten.py` to re-check every identifier against
# the live API before spending. Do not trust this file on its own.

verified_on: "2026-08-09"
pricing_source: "https://www.baseten.co/pricing/"
availability_source: "GET https://inference.baseten.co/v1/models, 2026-08-09"
base_url: "https://inference.baseten.co/v1"

models:
  # --- Kimi lineage: 3 version points -------------------------------------
  #
  # K2.7-Code is a code-specialised derivative sitting between two general
  # versions, which makes it the structural analogue of gemini-3.1-flash-lite:
  # the sibling that a platform-wide change may or may not have reached. That
  # is the single most useful comparison in this arm.
  moonshotai/Kimi-K2.6:
    lineage: kimi
    order: 1
    input: 0.95
    output: 4.00
    cached_input: 0.16
    status: stable

  moonshotai/Kimi-K2.7-Code:
    lineage: kimi
    order: 2
    input: 0.95
    output: 4.00
    cached_input: 0.16
    status: stable
    notes: "Code-specialised derivative, not a general successor to K2.6. The inheritance-failure cell."

  moonshotai/Kimi-K3:
    lineage: kimi
    order: 3
    input: 3.00
    output: 15.00
    cached_input: 0.30
    status: stable
    notes: "Most expensive model in the arm; output at $15/M dominates its cost."

  # --- GLM lineage: 2 version points --------------------------------------
  zai-org/GLM-4.7:
    lineage: glm
    order: 1
    input: 0.60
    output: 2.20
    cached_input: 0.12
    status: stable

  zai-org/GLM-5.2:
    lineage: glm
    order: 2
    input: 1.40
    output: 4.40
    cached_input: 0.14
    status: stable

  # --- GLM serving variant: same nominal weights, different serving stack ---
  #
  # Measuring quantization directly would need self-hosting. This cell obtains
  # the weaker but much cheaper version of the same question: does a pure DEPLOYMENT change, with no retraining, move
  # security? Baseten does not document what "Fast" changes, so a difference
  # here is evidence that something in the serving path matters and NOT a
  # measurement of quantization specifically. Say so if it moves.
  zai-org/GLM-5.2-Fast:
    lineage: glm-serving
    order: 2
    input: 2.10
    output: 6.60
    cached_input: 0.21
    status: stable
    notes: "Serving variant of GLM-5.2. Compare against zai-org/GLM-5.2, not across the lineage."

# Served on 2026-08-09 but outside this study's scope. Listed so the catalogue
# is on the record at this date.
available_not_used:
  - deepseek-ai/DeepSeek-V4-Flash-0731
  - deepseek-ai/DeepSeek-V4-Pro
  - nvidia/NVIDIA-Nemotron-3-Ultra-550B-A55B
  - openai/gpt-oss-120b
  - thinkingmachines/inkling
  - thinkingmachines/inkling-small

# NO LONGER SERVED HERE AS OF 2026-08-09, five weeks after they were.
#
# The 2026-07-02 catalogue was recorded at the time and is corroborated by
# AgentDojo trace files run against two of these ids on that date. Neither
# record is part of this release.
#
# This is an OPERATIONAL CONSTRAINT ON THIS ARM, not a finding about model
# artifacts. Open weights do not retire, because they pin to a revision hash on a
# hub, and that remains true; a hosted provider, however, gives reproducibility
# of the model NAME rather than of the weights.
# What this list records is narrower: which lineage points a hosted arm can still
# reach. It is why the model set above is K2.6 / K2.7-Code / K3.
not_served_here_since_2026_07_02:
  - moonshotai/Kimi-K2.5     # AgentDojo banking traces exist for this id, dated 2026-07-02
  - zai-org/GLM-5            # AgentDojo banking traces exist for this id, dated 2026-07-02
  - zai-org/GLM-5.1

# Named subsets for the --preset flag of run_sweep.py.
presets:
  smoke:
    description: "Cheapest model, Slack suite, 2 user tasks. Proves the pipeline for pennies."
    models: [zai-org/GLM-4.7]

  kimi-lineage:
    description: "3 Kimi version points, K2.7-Code being the derivative sibling."
    models: [moonshotai/Kimi-K2.6, moonshotai/Kimi-K2.7-Code, moonshotai/Kimi-K3]

  glm-lineage:
    description: "2 GLM version points across a major-version boundary."
    models: [zai-org/GLM-4.7, zai-org/GLM-5.2]

  glm-serving:
    description: "GLM-5.2 against its Fast serving variant. Deployment change, no retraining."
    models: [zai-org/GLM-5.2, zai-org/GLM-5.2-Fast]

  mvc:
    description: "The minimum viable check: 5 models across 2 families."
    # GLM-5.2-Fast is deliberately NOT here. The authors' scoping call, 2026-08-09:
    # what separates Fast from GLM-5.2 is Baseten's own serving stack, so
    # measuring it would make this provider's engineering a subject of the
    # study rather than the model lineage, which is a different paper. This arm
    # instead ASSUMES the provider serves vanilla open weights faithfully, and
    # that assumption belongs in the write-up as a stated limitation rather
    # than as a cell in the matrix. `glm-serving` above still exists if it is
    # ever wanted deliberately.
    models:
      - moonshotai/Kimi-K2.6
      - moonshotai/Kimi-K2.7-Code
      - moonshotai/Kimi-K3
      - zai-org/GLM-4.7
      - zai-org/GLM-5.2
